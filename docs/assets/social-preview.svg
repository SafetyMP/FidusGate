<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">FidusGate: every tool-call decision, a clear reason</title>
  <desc id="desc">MCP policy gateway and signed receipts. Inspect decisions, explore policy, verify signatures. Open-source reference implementation.</desc>
  <rect width="1280" height="640" fill="#f4f6f3"/>
  <rect width="18" height="640" fill="#185e46"/>
  <rect x="72" y="64" width="52" height="52" rx="14" fill="#185e46"/>
  <path d="M86 80h24v7H94v7h13v7H94v8h-8z" fill="#fff"/>
  <text x="142" y="103" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#152c23">FidusGate</text>
  <text x="76" y="176" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3" fill="#527161">MCP POLICY GATEWAY + SIGNED RECEIPTS</text>
  <text x="72" y="263" font-family="Arial,sans-serif" font-size="61" font-weight="700" fill="#152c23">Every decision.</text>
  <text x="72" y="336" font-family="Arial,sans-serif" font-size="61" font-weight="700" fill="#185e46">A clear reason.</text>
  <text x="76" y="400" font-family="Arial,sans-serif" font-size="24" fill="#53645c">Inspect decisions. Explore policy.</text>
  <text x="76" y="436" font-family="Arial,sans-serif" font-size="24" fill="#53645c">Verify Ed25519 receipts.</text>
  <rect x="768" y="154" width="440" height="350" rx="22" fill="#fff" stroke="#d7e1d9" stroke-width="2"/>
  <text x="800" y="201" font-family="Arial,sans-serif" font-size="15" letter-spacing="2" fill="#6b7a71">SYNTHETIC DEMO DECISION</text>
  <rect x="800" y="227" width="94" height="32" rx="16" fill="#fce8e3"/>
  <text x="822" y="250" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#9c3c2c">Denied</text>
  <text x="800" y="303" font-family="monospace" font-size="26" font-weight="700" fill="#152c23">execute_command</text>
  <text x="800" y="344" font-family="Arial,sans-serif" font-size="21" fill="#53645c">External script download blocked</text>
  <path d="M800 371h376" stroke="#d7e1d9"/>
  <circle cx="812" cy="411" r="12" fill="#e5f3eb"/>
  <path d="m806 411 4 4 8-9" fill="none" stroke="#185e46" stroke-width="2"/>
  <text x="838" y="418" font-family="Arial,sans-serif" font-size="20" fill="#185e46">Check the signed receipt</text>
  <text x="800" y="465" font-family="Arial,sans-serif" font-size="16" fill="#6b7a71">Signature validity does not prove execution.</text>
  <text x="76" y="554" font-family="Arial,sans-serif" font-size="20" fill="#53645c">Open-source reference implementation</text>
  <text x="76" y="587" font-family="Arial,sans-serif" font-size="18" fill="#6b7a71">github.com/SafetyMP/FidusGate</text>
  <text x="804" y="575" font-family="Arial,sans-serif" font-size="18" fill="#185e46">Try the interactive demo →</text>
</svg>
