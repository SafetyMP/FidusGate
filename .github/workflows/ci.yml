name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          cache: npm

      - run: chmod +x scripts/*.sh
      - name: Hermetic verify
        run: ./scripts/verify.sh

  cedar-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-03
        with:
          toolchain: stable
      - run: chmod +x scripts/*.sh
      - name: Install cedar CLI
        run: ./scripts/install-cedar-cli.sh
      - name: Cedar validate
        env:
          REQUIRE_CEDAR_CLI: "true"
        run: ./scripts/cedar-validate.sh

  integration:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: chmod +x scripts/*.sh
      - name: Integration smoke
        run: ./scripts/integration-smoke.sh

      - name: Adversarial tier
        run: bash ./scripts/adversarial.sh
