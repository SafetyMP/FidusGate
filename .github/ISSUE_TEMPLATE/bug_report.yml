name: Bug report
description: Report unexpected behavior in the public demo, connected console, gateway, or policy engine.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic reproduction steps and redact credentials, private receipt payloads, and personal data.
        Report undisclosed vulnerabilities privately through [the security policy](https://github.com/SafetyMP/FidusGate/blob/main/SECURITY.md).
  - type: dropdown
    id: experience
    attributes:
      label: Where did this happen?
      options:
        - Public GitHub Pages demo
        - Gateway-connected console
        - Gateway / MCP client
        - Cedar daemon / policy
        - Build / CI / documentation
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: Give the smallest synthetic example, including commands or console actions.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        Commit / release:
        Browser and version:
        OS:
        Node / npm (if local):
        Console workspace (if applicable):
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: Redacted logs or screenshots
      description: Preserve the original evidence locally. Never paste bootstrap keys, bearer tokens, or signing secrets.
