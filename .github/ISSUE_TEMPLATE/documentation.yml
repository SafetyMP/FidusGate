name: Documentation
description: Ask about setup, receipts, policy behavior, architecture, or contributor workflow.
title: "[Docs]: "
body:
  - type: markdown
    attributes:
      value: Use synthetic examples and redact credentials or private data. Undisclosed vulnerabilities belong in private security reporting.
  - type: textarea
    id: question
    attributes:
      label: What is unclear or incorrect?
      description: Link the document or section and describe the expected clarification.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: What have you already tried?
      placeholder: |
        Public demo or local console:
        Commit / release:
        Docs read:
        Commands run:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Public demo
        - Connected console / local setup
        - Receipt signatures / chain verification
        - Cedar policy / policy.cedar
        - Gateway / MCP
        - Docker / CI
        - Contributor / agent guidance
        - Other
