name: 'FidusGate Receipt and Workflow Checks'
description: 'Reference checks for selected unsafe workflow expressions and recent commit receipt signatures against a supplied public key.'
inputs:
  fidusgate_root_key:
    description: 'FidusGate master root public key for verifying commit receipts.'
    required: true
runs:
  using: 'node20'
  main: 'dist/index.js'
